# =============================================================
# SurakshaAI — Alembic Configuration
# =============================================================
# Run migrations:
#   alembic upgrade head
#   alembic downgrade -1
#   alembic revision --autogenerate -m "description"
# =============================================================

[alembic]
script_location = alembic
prepend_sys_path = .

# Database URL is read from environment variable
# Set DATABASE_URL in your .env file
sqlalchemy.url = %(DATABASE_URL)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S